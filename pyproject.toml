[project]
name = "reev-har"
version = "0.1.0"
description = "Human Activity Recognition for Knee Orthosis"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "onnx>=1.14",
    "skl2onnx>=1.16",
    "onnxruntime>=1.16",
    "matplotlib>=3.7"
]